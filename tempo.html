<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tempo | AI planning workspace</title><style>
:root{font-family:Arial,sans-serif;color:#23332f;background:#f3f5f1;--ink:#23332f;--muted:#708079;--line:#dce4df;--paper:#fffefa;--mint:#dcebe5;--teal:#24746a;--coral:#e57a64;--gold:#d9aa51;--shadow:0 20px 60px #203a3210}*{box-sizing:border-box}body{margin:0;background:#f3f5f1}.app{display:flex;min-height:100vh}.sidebar{width:242px;background:#edf1ec;border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column;flex-shrink:0}.logo{font:500 28px Georgia,serif;padding:0 12px 32px}.logo b{display:inline-grid;place-items:center;width:31px;height:31px;color:white;background:var(--teal);border-radius:9px;font:18px Arial;margin-right:8px}.account-mini{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #d4ded7;background:#ffffff80;border-radius:9px;margin-bottom:24px;cursor:pointer}.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#e4af8d;color:#604537;font-size:10px;font-weight:bold}.account-mini strong,.account-mini small{display:block}.account-mini strong{font-size:12px}.account-mini small{font-size:10px;color:var(--muted);margin-top:3px}.nav{display:grid;gap:4px}.nav button{border:0;background:none;text-align:left;color:#697771;padding:12px;border-radius:7px;font-size:13px;cursor:pointer}.nav button:hover,.nav button.active{color:var(--teal);background:#fff;font-weight:bold}.nav button span{display:inline-block;width:23px;color:inherit}.sidebar-note{margin-top:auto;border:1px solid #eee1c7;background:#fff9ed;border-radius:8px;padding:14px;font-size:11px;color:#876b39;line-height:1.45}.sidebar-note b{display:block;color:#6e572d;margin-bottom:4px}.main{flex:1;min-width:0}.topbar{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5%;font-size:12px;color:var(--muted)}.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}.status{display:flex;align-items:center;gap:6px}.status i{width:6px;height:6px;border-radius:50%;background:#54a487}.page{max-width:1180px;margin:auto;padding:45px 5% 70px}.page-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;color:var(--teal);font-size:10px;font-weight:bold}.page-title{font:500 40px Georgia,serif;margin:8px 0 0;color:#263a35}.button{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:6px;padding:11px 15px;background:var(--teal);color:white;font-weight:bold;font-size:12px;cursor:pointer}.button.secondary{background:white;color:var(--teal);border:1px solid #c8d7cf}.button.danger{background:#fff;color:#b34f3d;border:1px solid #efd0c8}.hero{display:flex;justify-content:space-between;gap:28px;background:var(--mint);padding:34px 40px;border-radius:10px}.hero h2{font:500 34px Georgia,serif;margin:14px 0 8px}.hero p{max-width:560px;color:#507168;font-size:13px;line-height:1.6;margin:0 0 18px}.hero .link{color:var(--teal);font-size:12px;font-weight:bold;cursor:pointer}.hero-badge{width:116px;height:116px;border:1px solid #24746a55;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.hero-badge div{width:87px;height:87px;background:#f8fcf8;border-radius:50%;display:grid;place-content:center;text-align:center}.hero-badge strong{font:500 28px Georgia,serif;color:var(--teal)}.hero-badge small{font-size:9px;color:var(--muted)}.columns{display:grid;grid-template-columns:1.45fr .8fr;gap:18px;margin-top:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:23px}.card-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:21px}.card h3{font-size:14px;margin:0}.muted{font-size:11px;color:var(--muted)}.timeline .item{display:grid;grid-template-columns:57px 15px 1fr;min-height:67px}.time{text-align:right;color:var(--muted);font-size:10px}.time small{display:block;color:#aab5af;margin-top:4px}.rail{width:1px;background:#dfe8e2;position:relative;margin:4px 0}.rail:before{content:'';position:absolute;width:7px;height:7px;border-radius:50%;left:-3px;top:0;background:var(--teal)}.item.fixed .rail{background:#f1d8d0}.item.fixed .rail:before{background:var(--coral)}.item-body{padding:0 0 20px 15px;font-size:12px}.item-body small{display:block;color:var(--muted);margin-top:5px;line-height:1.4}.energy{float:right;border-radius:15px;padding:3px 7px;font-size:9px;background:#e4f1ed;color:var(--teal)}.energy.high{background:#fae4de;color:#b25544}.progress-number{font:500 38px Georgia,serif;color:var(--teal)}.progress{height:6px;background:#e6ece8;border-radius:9px;margin:18px 0 11px}.progress i{display:block;height:100%;width:0;background:var(--teal);border-radius:9px}.note{margin-top:18px;background:#fff9ed;border:1px solid #eee1c7;border-radius:8px;padding:17px;font-size:11px;color:#806e4e;line-height:1.5}.chat-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.8fr);gap:20px}.chat-window{background:var(--paper);border:1px solid var(--line);border-radius:9px;min-height:625px;display:flex;flex-direction:column;overflow:hidden}.chat-top{padding:17px 21px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.tempo-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--mint);color:var(--teal)}.chat-top strong,.chat-top small{display:block}.chat-top strong{font-size:12px}.chat-top small{font-size:10px;color:var(--muted);margin-top:3px}.chat-top .muted{margin-left:auto}.messages{padding:26px 25px;flex:1;overflow:auto}.message{max-width:78%;padding:13px 15px;background:#edf3ef;border-radius:5px 12px 12px 12px;margin-bottom:14px;font-size:12px;line-height:1.55}.message.user{margin-left:auto;background:var(--teal);color:#fff;border-radius:12px 5px 12px 12px}.message.plan{background:#fff9ed;border:1px solid #eadfca;max-width:93%;color:var(--ink)}.plan-title{font-weight:bold;color:var(--teal);margin-bottom:10px}.plan-row{display:flex;align-items:center;gap:8px;border-top:1px solid #eee5d3;padding:9px 0}.plan-row span:first-child{font-size:10px;color:var(--muted);width:82px}.plan-row strong{font-size:11px;flex:1}.plan-row button{border:0;background:none;color:var(--teal);font-size:11px;cursor:pointer}.suggestions{display:flex;gap:7px;padding:0 18px 14px;flex-wrap:wrap}.suggestions button{border:1px solid #cbd9d2;background:white;color:var(--teal);border-radius:18px;padding:8px 11px;font-size:10px;cursor:pointer}.composer{display:flex;gap:6px;border:1px solid var(--line);border-radius:7px;padding:4px;margin:0 17px 17px}.composer input{border:0;outline:0;padding:10px;flex:1;font-size:12px;min-width:0}.composer button{border:0;background:var(--teal);color:white;border-radius:5px;padding:0 15px}.guide{background:#edf2ec;padding:23px;border-radius:9px;height:max-content}.guide h3{font:500 22px Georgia,serif;margin:9px 0}.guide p{font-size:11px;color:var(--muted);line-height:1.55}.guide-step{display:flex;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid #dce5dd;font-size:11px;color:#61746d}.guide-step b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#dcebe5;color:var(--teal);font-size:10px}.guide-step.active{color:var(--ink);font-weight:bold}.guide-step.active b{background:var(--teal);color:white}.edit-panel{background:#fff;border:1px solid var(--line);border-radius:7px;margin-top:11px;padding:11px}.edit-panel input,.edit-panel select{width:100%;padding:7px;border:1px solid var(--line);border-radius:4px;font-size:11px;margin:3px 0 7px}.edit-panel label{font-size:9px;color:var(--muted)}.edit-actions{display:flex;gap:6px}.edit-actions button{padding:7px 10px;font-size:10px}.task-list{display:grid;gap:8px}.task-card{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--paper);padding:16px;border-radius:8px}.task-card input{accent-color:var(--teal)}.task-card main{flex:1}.task-card strong{font-size:13px}.task-card small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.task-card .delete{border:0;background:none;color:var(--coral);cursor:pointer;font-size:18px}.schedule-board{background:var(--paper);border:1px solid var(--line);padding:26px;border-radius:9px}.warning{margin-top:13px;padding:14px;background:#fff6e8;border:1px solid #f0dfbd;color:#976c29;font-size:11px;border-radius:6px}.modal-bg{position:fixed;inset:0;background:#203a3248;display:grid;place-items:center;padding:20px;z-index:5}.modal{width:min(420px,100%);background:var(--paper);padding:26px;border-radius:10px;box-shadow:var(--shadow)}.modal h2{font:500 25px Georgia,serif;margin:9px 0 19px}.modal label{display:block;font-size:11px;margin:13px 0}.modal input{display:block;width:100%;border:1px solid var(--line);padding:10px;border-radius:5px;margin-top:6px}.modal .button{margin-top:7px;width:100%;justify-content:center}@media(max-width:900px){.sidebar{width:205px}.page{padding-left:4%;padding-right:4%}.chat-layout{grid-template-columns:1fr}.guide{display:none}}@media(max-width:650px){.sidebar{display:none}.topbar{height:60px;padding:0 20px}.page{padding:30px 20px 50px}.page-head{display:block}.page-head .button{margin-top:17px}.page-title{font-size:34px}.hero{padding:27px 23px}.hero h2{font-size:29px}.hero-badge{display:none}.columns{display:block}.card{margin-top:17px}.chat-window{min-height:650px}.messages{padding:22px 16px}.message{max-width:90%}.suggestions{overflow:auto;flex-wrap:nowrap}.suggestions button{white-space:nowrap}.plan-row span:first-child{width:65px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="logo"><b>✦</b>tempo</div><div class="account-mini" id="accountButton"><div class="avatar" id="avatar">AS</div><div><strong id="accountName">Alex Smith</strong><small id="accountEmail">Local account</small></div></div><nav class="nav"><button class="active" data-view="today"><span>◈</span>Today</button><button data-view="chat"><span>◌</span>Ask Tempo</button><button data-view="schedule"><span>▦</span>Schedule</button><button data-view="tasks"><span>✓</span>Tasks</button></nav><div class="sidebar-note"><b>Small steps count</b>One focused block is enough to move the day forward.</div></aside><main class="main"><header class="topbar"><span id="crumb">Today</span><div class="right"><span class="status"><i></i> Local planning mode</span><span id="topUser">Alex</span></div></header><div id="content"></div></main></div><script>
const TASK_KEY='tempo.standalone.tasks.v2',USER_KEY='tempo.standalone.user';let tasks=JSON.parse(localStorage.getItem(TASK_KEY)||'null')||[{title:'Prepare biology notes',duration:90,priority:'High',energy:'High',time:'09:00'},{title:'Team stand-up',duration:30,priority:'Fixed',energy:'Medium',time:'10:00',fixed:true},{title:'Finish project proposal',duration:60,priority:'High',energy:'Medium',time:'10:30'},{title:'Lunch with Maya',duration:60,priority:'Fixed',energy:'Low',time:'13:00',fixed:true},{title:'Pick up groceries',duration:40,priority:'Medium',energy:'Low',time:'14:15'}];let user=JSON.parse(localStorage.getItem(USER_KEY)||'null')||{name:'Alex Smith',email:'Local account'};let activeEdit=null;const save=()=>localStorage.setItem(TASK_KEY,JSON.stringify(tasks));const initials=()=>user.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();document.getElementById('accountName').textContent=user.name;document.getElementById('accountEmail').textContent=user.email;document.getElementById('avatar').textContent=initials();document.getElementById('topUser').textContent=user.name.split(' ')[0];
function render(view='today'){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===view));document.getElementById('crumb').textContent=view==='today'?'Today':view==='chat'?'Ask Tempo':view[0].toUpperCase()+view.slice(1);document.getElementById('content').innerHTML=view==='today'?dashboard():view==='chat'?chatPage():view==='schedule'?schedulePage():tasksPage()}
function head(k,t,a=''){return `<div class="page-head"><div><div class="eyebrow">${k}</div><div class="page-title">${t}</div></div>${a}</div>`}
function dashboard(){let completed=tasks.filter(x=>x.done).length;return `<div class="page">${head(new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}),'A clear day starts here.','<button class="button" onclick="render(\'chat\')">◌ Tell Tempo what you need</button>')}<section class="hero"><div><div class="eyebrow">Good morning, ${user.name.split(' ')[0]}</div><h2>Make space for what matters.</h2><p>Your plan protects your focus, respects fixed commitments, and leaves room to breathe. Tell Tempo what changed and it will format a new plan for you.</p><span class="link" onclick="render('chat')">Build or change my plan →</span></div><div class="hero-badge"><div><strong>${Math.round(completed/Math.max(tasks.length,1)*100)}%</strong><small>complete</small></div></div></section><div class="columns"><section class="card"><div class="card-head"><div><div class="eyebrow">Your day</div><h3>Today’s rhythm</h3></div><button class="button secondary" onclick="render('schedule')">Full schedule →</button></div><div class="timeline">${scheduleRows()}</div></section><section class="card"><h3>Daily progress</h3><div class="progress-number">${completed}</div><div class="muted">of ${tasks.length} tasks complete</div><div class="progress"><i style="width:${Math.max(7,completed/Math.max(tasks.length,1)*100)}%"></i></div><div class="muted">A thoughtful pace is still progress.</div><div class="note"><b>Tempo’s note</b>I left gaps between demanding work so your plan stays possible, not just optimistic.</div></section></div></div>`}
function scheduleRows(){return tasks.slice(0,7).map(x=>`<div class="item ${x.fixed?'fixed':''}"><div class="time">${x.time}<small>${x.duration} min</small></div><div class="rail"></div><div class="item-body"><b>${x.title}</b><span class="energy ${x.energy==='High'?'high':''}">${x.energy}</span><small>${x.fixed?'Fixed commitment':'Flexible block'} · ${x.priority} priority</small></div></div>`).join('')}
function chatPage(){return `<div class="page">${head('Your planning partner','Tell Tempo what to do.','<span class="status muted">● Ready to plan</span>')}<div class="chat-layout"><section class="chat-window"><div class="chat-top"><div class="tempo-icon">✦</div><div><strong>Tempo</strong><small>Turns plain language into an editable plan</small></div><span class="muted">Local AI mode</span></div><div class="messages" id="messages"><div class="message">Tell me what your day needs. For example: “I have 30 minutes today and need to prioritize exam prep.”</div><div class="message">I’ll turn it into clear time blocks, protect fixed commitments, and explain what I could not fit.</div></div><div class="suggestions"><button onclick="sendPrompt('Make this less intense with more breaks')">Make it less intense</button><button onclick="sendPrompt('Move exercise to the morning')">Move exercise earlier</button><button onclick="sendPrompt('I only have 30 minutes today')">I only have 30 minutes</button></div><form class="composer" onsubmit="event.preventDefault();sendPrompt(this.prompt.value);this.reset()"><input name="prompt" aria-label="Tell Tempo what to do" placeholder="e.g. Prioritize my exam preparation..." required><button>Plan it</button></form></section><aside class="guide"><div class="eyebrow">How it works</div><h3>You stay in control.</h3><p>Start with a natural request. Tempo formats the result. Then edit any block manually before you commit to it.</p><div class="guide-step active"><b>1</b> Tell Tempo what changed</div><div class="guide-step"><b>2</b> Review the proposed plan</div><div class="guide-step"><b>3</b> Edit and save the details</div><div class="guide-step"><b>4</b> Follow the next kind step</div></aside></div></div>`}
function sendPrompt(prompt){if(!prompt.trim())return;const box=document.getElementById('messages');box.innerHTML+=`<div class="message user">${escapeHtml(prompt)}</div>`;const lower=prompt.toLowerCase();let updates='I kept your fixed commitments protected and added room between blocks.';if(lower.includes('30 minutes')){tasks=tasks.filter(x=>x.fixed||x.priority==='High').slice(0,3);tasks=tasks.map((x,i)=>x.fixed?x:{...x,duration:Math.min(x.duration,30)});updates='I narrowed the plan to the highest-value work and capped flexible blocks at 30 minutes.'}else if(lower.includes('break')||lower.includes('intense'))updates='I reduced the load and kept a longer reset after your most demanding block.';else if(lower.includes('exercise')||lower.includes('morning'))updates='I would place movement in the morning. Add the exact activity below if you want it included.';save();setTimeout(()=>{box.innerHTML+=`<div class="message plan"><div class="plan-title">Here is a formatted plan based on that.</div>${tasks.filter(x=>!x.done).slice(0,5).map((x,i)=>`<div class="plan-row"><span>${x.time||'Open block'}</span><strong>${x.title}</strong><button onclick="editTask(${tasks.indexOf(x)})">Edit</button></div>`).join('')}<p class="muted">${updates}</p><button class="button secondary" onclick="render('schedule')">Review full schedule →</button></div>`;box.scrollTop=box.scrollHeight},180)}
function escapeHtml(value){return value.replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function schedulePage(){return `<div class="page">${head('Plan view','Your schedule','<button class="button secondary" onclick="render(\'chat\')">Change with Tempo</button>')}<section class="schedule-board"><div class="card-head"><div><h3>Today’s plan</h3><span class="muted">Fixed commitments are marked in coral. Flexible blocks can be edited.</span></div></div><div class="timeline">${scheduleRows()}</div><div class="warning">Nothing is scheduled over a fixed commitment. Your plan includes transition time and realistic gaps.</div></section></div>`}
function tasksPage(){return `<div class="page">${head('Your workload','Tasks to make room for.','<button class="button" onclick="addTask()">+ Add task</button>')}<div class="task-list">${tasks.map((x,i)=>`<div class="task-card"><input type="checkbox" ${x.done?'checked':''} onchange="toggleTask(${i})"><main><strong>${escapeHtml(x.title)}</strong><small>${x.priority} priority · ${x.duration} minutes · ${x.energy} energy</small></main><button class="button secondary" onclick="editTask(${i})">Edit</button><button class="delete" onclick="removeTask(${i})" aria-label="Delete ${escapeHtml(x.title)}">×</button></div>`).join('')}</div></div>`}
function editTask(i){activeEdit=i;const x=tasks[i];document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><form class="modal" onsubmit="event.preventDefault();saveEdit(${i},this)"><div class="eyebrow">Edit block</div><h2>Make this fit your day.</h2><label>Title<input name="title" value="${escapeHtml(x.title)}" required></label><label>Start time<input name="time" type="time" value="${x.time||'09:00'}"></label><label>Minutes<input name="duration" type="number" min="5" step="5" value="${x.duration}"></label><label>Priority<select name="priority"><option ${x.priority==='High'?'selected':''}>High</option><option ${x.priority==='Medium'?'selected':''}>Medium</option><option ${x.priority==='Low'?'selected':''}>Low</option></select></label><button class="button" type="submit">Save changes</button></form></div>`)}function saveEdit(i,form){tasks[i]={...tasks[i],title:form.title.value,time:form.time.value,duration:Number(form.duration.value),priority:form.priority.value};save();document.getElementById('modal').remove();render('tasks')}function addTask(){let title=prompt('What should Tempo make room for?');if(!title)return;tasks.push({title,duration:30,priority:'Medium',energy:'Medium',time:'15:00'});save();render('tasks')}function toggleTask(i){tasks[i].done=!tasks[i].done;save();render('tasks')}function removeTask(i){tasks.splice(i,1);save();render('tasks')}
function account(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="accountModal"><form class="modal" onsubmit="event.preventDefault();saveAccount(this)"><div class="eyebrow">Your local account</div><h2>Make Tempo yours.</h2><p class="muted">This demo stores your profile and plan only in this browser.</p><label>Name<input name="name" value="${escapeHtml(user.name)}" required></label><label>Email<input name="email" type="email" value="${escapeHtml(user.email==='Local account'?'':user.email)}" placeholder="you@example.com"></label><button class="button" type="submit">Save account</button></form></div>`)}function saveAccount(form){user={name:form.name.value,email:form.email.value||'Local account'};localStorage.setItem(USER_KEY,JSON.stringify(user));location.reload()}
document.querySelectorAll('.nav button').forEach(x=>x.onclick=()=>render(x.dataset.view));document.getElementById('accountButton').onclick=account;render();
</script><script src="schedule-fix.js"></script></body></html>
